<div class="modal fade" id="letterModal" tabindex="-1" aria-labelledby="modalLetterTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalLetterTitle">Письмо</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form id="letterForm" method="post" action="">
        <div class="modal-body">

          <div class="row g-3">

            <div class="col-md-4">
              <label class="form-label">Дата <span class="text-danger">*</span></label>
              <input type="date" id="fDate" name="date" class="form-control" required>
            </div>

            <div class="col-md-8">
              <label class="form-label">Номер</label>
              <input type="text" id="fNumber" name="number" class="form-control"
                     placeholder="напр.: Исх.123/2026">
            </div>

            <!-- Направление + Контрагент (#13) -->
            <div class="col-12">
              <label class="form-label">Направление</label>
              <div class="btn-group w-100" role="group" id="directionGroup">
                <input type="radio" class="btn-check" name="direction" id="dirOut" value="out" autocomplete="off" checked>
                <label class="btn btn-outline-primary" for="dirOut" onclick="onDirectionChange('out')">→ Исходящее</label>
                <input type="radio" class="btn-check" name="direction" id="dirIn" value="in" autocomplete="off">
                <label class="btn btn-outline-secondary" for="dirIn" onclick="onDirectionChange('in')">← Входящее</label>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label" id="cpLabel">Кому</label>
              <div class="input-group">
                <input type="text" id="cpInput" class="form-control"
                       placeholder="Организация, ФИО или должность..."
                       autocomplete="off">
                <button type="button" class="btn btn-outline-success" id="cpAddBtn"
                        title="Создать адресата в справочнике"
                        onclick="toggleDirCreate(true)">+</button>
              </div>
              <div id="cpSuggestions" class="list-group mt-1"
                   style="display:none; position:absolute; z-index:1060; min-width:260px"></div>
              <div id="cpSelected" class="form-text" style="display:none"></div>
              <input type="hidden" id="fOrgId" name="org_id" value="">
              <input type="hidden" id="fContactId" name="contact_id" value="">
              <input type="hidden" id="fEmploymentId" name="employment_id" value="">
              <input type="hidden" id="fRecipientUpdate" name="recipient_update" value="">
              <input type="hidden" id="fCounterpartyId" name="counterparty_id" value="">
            </div>

            <!-- Создание адресата в общем справочнике (та же модалка, без вложенной формы) -->
            <div class="col-12" id="dirCreateSection" style="display:none">
              <div class="card card-body bg-light border mb-2">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="fw-semibold"><i class="bi bi-person-plus me-1"></i>Новый адресат</span>
                  <button type="button" class="btn-close" onclick="toggleDirCreate(false)"></button>
                </div>
                <div class="mb-2">
                  <label class="form-label fw-bold">Новая организация</label>
                  <div class="input-group input-group-sm">
                    <input type="text" id="dirNewOrg" class="form-control"
                           placeholder="Название, если организации нет в списке ниже">
                    <button type="button" class="btn btn-outline-secondary" id="dirNewOrgBtn"
                            onclick="dirCreateOrg()">Создать</button>
                  </div>
                </div>
                {% from '_directory_contact_fields.html' import directory_contact_fields %}
                {{ directory_contact_fields(orgs, field_prefix='dir_') }}
                <div class="mt-2">
                  <button type="button" class="btn btn-primary btn-sm" id="dirCreateSubmitBtn"
                          onclick="dirCreateContact()">Создать и выбрать</button>
                </div>
                <div id="dirCreateMsg" class="form-text mt-2" style="display:none"></div>
              </div>
            </div>
            <!-- /Направление + адресат -->

            <div class="col-12">
              <label class="form-label d-flex align-items-center justify-content-between">
                <span>Тема</span>
                <div class="position-relative">
                  <button type="button" class="btn btn-sm btn-outline-secondary"
                          id="tplBtn" onclick="toggleTplDropdown()">
                    📋 Шаблон
                  </button>
                  <div id="tplDropdown"
                       class="list-group shadow"
                       style="display:none; position:absolute; right:0; top:100%; z-index:1070;
                              min-width:280px; max-height:260px; overflow-y:auto;">
                    <div class="list-group-item list-group-item-light py-1 px-2 small text-muted"
                         id="tplLoading">Загрузка...</div>
                  </div>
                </div>
              </label>
              <input type="text" id="fSubject" name="subject" class="form-control"
                     placeholder="Краткое описание">
            </div>

            <div class="col-md-6">
              <label class="form-label">Исполнитель</label>
              <select id="fExecutor" name="executor_id" class="form-select">
                <option value="">— не выбран —</option>
                {% for u in users %}
                <option value="{{ u.id }}">{{ u.full_name or u.username }}</option>
                {% endfor %}
              </select>
            </div>

            <div class="col-12">
              <label class="form-label">Примечание</label>
              <textarea id="fNote" name="note" class="form-control" rows="3"
                        placeholder="Дополнительная информация..."></textarea>
            </div>

            <div class="col-12">
              <label class="form-label">Теги</label>
              <div class="d-flex flex-wrap gap-1 mb-1" id="tagBadges"></div>
              <div class="input-group">
                <input type="text" id="tagInput" class="form-control"
                       placeholder="Начните ввод или выберите тег..."
                       autocomplete="off">
                <button type="button" class="btn btn-outline-secondary" onclick="addTagFromInput()">Добавить</button>
              </div>
              <div id="tagSuggestions" class="list-group mt-1" style="display:none; position:absolute; z-index:1060; min-width:220px"></div>
              <input type="hidden" id="fTags" name="tags" value="">
              <small class="text-muted">Вводите тег и нажмите Enter или «Добавить». Можно через запятую.</small>
            </div>

          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
      </form>

    </div>
  </div>
</div>

<script>
// ─── Направление (#13) ───

function onDirectionChange(dir) {
  document.getElementById('cpLabel').textContent = (dir === 'out') ? 'Кому' : 'От кого';
}

let _cpTimer = null;

// CSRF-токен общих JSON-эндпойнтов справочника
const DIR_CSRF = {{ dir_csrf_token() | tojson }};

// ─── Адресат из общего справочника ───

function _setRecipient(orgId, contactId, employmentId, display, info, markUpdate = true) {
  document.getElementById('fOrgId').value = orgId || '';
  document.getElementById('fContactId').value = contactId || '';
  document.getElementById('fEmploymentId').value = employmentId || '';
  // Флаг замены адресата ставится только при выборе пользователем,
  // но не при открытии существующего письма на редактирование.
  document.getElementById('fRecipientUpdate').value = markUpdate ? '1' : '';
  document.getElementById('fCounterpartyId').value = '';
  document.getElementById('cpInput').value = display || '';
  const sel = document.getElementById('cpSelected');
  if (info) { sel.textContent = info; sel.style.display = 'block'; }
  else { sel.style.display = 'none'; sel.textContent = ''; }
}

function _clearRecipient() {
  document.getElementById('fOrgId').value = '';
  document.getElementById('fContactId').value = '';
  document.getElementById('fEmploymentId').value = '';
  document.getElementById('fRecipientUpdate').value = '';
  document.getElementById('fCounterpartyId').value = '';
  const sel = document.getElementById('cpSelected');
  sel.style.display = 'none'; sel.textContent = '';
}

function fetchCpSuggestions(q) {
  fetch('/phonebook/api/search?q=' + encodeURIComponent(q))
    .then(r => r.json())
    .then(items => {
      const box = document.getElementById('cpSuggestions');
      box.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'list-group-item small text-muted py-1 px-2';
        empty.textContent = 'Ничего не найдено — создайте адресата кнопкой «+»';
        box.appendChild(empty);
        box.style.display = 'block';
        return;
      }
      items.forEach(item => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'list-group-item list-group-item-action py-1 px-2';
        a.textContent = item.display;
        a.addEventListener('click', function (e) {
          e.preventDefault();
          _setRecipient(item.org_id, item.contact_id, item.employment_id,
                       item.display, '');
          hideCpSuggestions();
        });
        box.appendChild(a);
      });
      box.style.display = 'block';
    });
}

function hideCpSuggestions() {
  const box = document.getElementById('cpSuggestions');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; }
}

// ─── Создание адресата (карточка справочника внутри модалки письма) ───

function toggleDirCreate(show) {
  const sec = document.getElementById('dirCreateSection');
  sec.style.display = show ? 'block' : 'none';
  const msg = document.getElementById('dirCreateMsg');
  msg.style.display = 'none';
  msg.textContent = '';
}

function _dirMsg(text, isErr) {
  const msg = document.getElementById('dirCreateMsg');
  msg.textContent = text;
  msg.className = 'form-text mt-2 ' + (isErr ? 'text-danger' : 'text-success');
  msg.style.display = 'block';
}

async function dirCreateOrg() {
  const inp = document.getElementById('dirNewOrg');
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  const btn = document.getElementById('dirNewOrgBtn');
  btn.disabled = true;
  try {
    const r = await fetch('/phonebook/api/orgs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Dir-CSRF': DIR_CSRF},
      body: JSON.stringify({name: name}),
    });
    const data = await r.json();
    if (!r.ok) {
      _dirMsg(data.error || 'Не удалось сохранить организацию', true);
      return;
    }
    const sel = document.getElementById('dir_orgSelectnew');
    let exists = Array.from(sel.options).some(o => o.value == data.org_id);
    if (!exists) {
      const opt = new Option(data.name, data.org_id);
      opt.dataset.address = '';
      sel.add(opt);
    }
    sel.value = String(data.org_id);
    _dirMsg(data.message || 'Организация сохранена в справочнике');
    inp.value = '';
  } catch (e) {
    _dirMsg('Сеть недоступна — организация не сохранена', true);
  } finally {
    btn.disabled = false;
  }
}

async function dirCreateContact() {
  const fullName = document.getElementById('dir_full_name').value.trim();
  if (!fullName) { _dirMsg('Укажите ФИО', true); return; }
  const sel = document.getElementById('dir_orgSelectnew');
  const payload = {
    full_name: fullName,
    org_id: sel.value || null,
    position: document.getElementById('dir_position').value.trim(),
    room: document.getElementById('dir_room').value.trim(),
    phone_work: document.getElementById('dir_phone_work').value.trim(),
    phone_ext: document.getElementById('dir_phone_ext').value.trim(),
    phone_personal: document.getElementById('dir_phone_personal').value.trim(),
    email: document.getElementById('dir_email').value.trim(),
    inn: document.getElementById('dir_inn').value.trim(),
    notes: document.getElementById('dir_notes').value.trim(),
  };
  const btn = document.getElementById('dirCreateSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'Сохранение...';
  try {
    const r = await fetch('/phonebook/api/contacts', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'X-Dir-CSRF': DIR_CSRF},
      body: JSON.stringify(payload),
    });
    const data = await r.json();
    if (!r.ok) {
      if (r.status === 409 && data.candidates) {
        const names = data.candidates.map(c =>
          c.full_name + ' (' + (c.org_name || 'без орг.') + ')').join('; ');
        _dirMsg('Однофамильцы уже есть: ' + names
                + '. Уточните ФИО или выберите существующего через поиск.', true);
      } else {
        _dirMsg(data.error || 'Не удалось сохранить контакт', true);
      }
      return;
    }
    const display = fullName + (payload.position ? ' — ' + payload.position : '');
    _setRecipient(payload.org_id, data.contact_id, data.employment_id || '',
                  display,
                  'Карточка сохранена в справочнике — она останется там, даже если письмо не будет отправлено.');
    toggleDirCreate(false);
  } catch (e) {
    _dirMsg('Сеть недоступна — контакт не сохранён', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Создать и выбрать';
  }
}

// ─── Теги ───

let _currentTags = [];

function updateTagBadges(tagList) {
  _currentTags = tagList.slice();
  const container = document.getElementById('tagBadges');
  container.innerHTML = '';
  _currentTags.forEach((tag, idx) => {
    const span = document.createElement('span');
    span.className = 'badge bg-secondary d-flex align-items-center gap-1';
    span.style.cursor = 'default';
    span.innerHTML = `${tag} <button type="button" class="btn-close btn-close-white" style="font-size:.6rem" onclick="removeTag(${idx})"></button>`;
    container.appendChild(span);
  });
  document.getElementById('fTags').value = _currentTags.join(', ');
}

function addTag(name) {
  const normalized = name.trim().toLowerCase();
  if (!normalized) return;
  if (_currentTags.includes(normalized)) return;
  _currentTags.push(normalized);
  updateTagBadges(_currentTags);
}

function removeTag(idx) {
  _currentTags.splice(idx, 1);
  updateTagBadges(_currentTags);
}

function addTagFromInput() {
  const input = document.getElementById('tagInput');
  const raw = input.value;
  raw.split(',').forEach(t => addTag(t));
  input.value = '';
  hideSuggestions();
}

// ─── autocomplete тегов ───

let _acTimer = null;

document.addEventListener('DOMContentLoaded', function () {
  const tagInput = document.getElementById('tagInput');
  if (tagInput) {
    tagInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addTagFromInput();
      } else if (e.key === 'Escape') {
        hideSuggestions();
      }
    });
    tagInput.addEventListener('input', function () {
      clearTimeout(_acTimer);
      const q = this.value.trim();
      if (!q) { hideSuggestions(); return; }
      _acTimer = setTimeout(() => fetchSuggestions(q), 200);
    });
  }

  const cpInput = document.getElementById('cpInput');
  if (cpInput) {
    cpInput.addEventListener('input', function () {
      clearTimeout(_cpTimer);
      _clearRecipient();
      const q = this.value.trim();
      if (!q) { hideCpSuggestions(); return; }
      _cpTimer = setTimeout(() => fetchCpSuggestions(q), 200);
    });
    cpInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') hideCpSuggestions();
    });
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest('#tagInput') && !e.target.closest('#tagSuggestions')) {
      hideSuggestions();
    }
    if (!e.target.closest('#cpInput') && !e.target.closest('#cpSuggestions')) {
      hideCpSuggestions();
    }
    if (!e.target.closest('#tplBtn') && !e.target.closest('#tplDropdown')) {
      hideTplDropdown();
    }
  });

  document.getElementById('letterModal').addEventListener('hidden.bs.modal', function () {
    hideTplDropdown();
    hideSuggestions();
    hideCpSuggestions();
    document.getElementById('cpInput').value = '';
    _clearRecipient();
    toggleDirCreate(false);
    document.getElementById('dirOut').checked = true;
    document.getElementById('cpLabel').textContent = 'Кому';
  });
});

// Адрес организации для общей карточки адресата (как в телефоне)
function fetchAddress(select) {
  const opt = select.options[select.selectedIndex];
  const address = opt ? (opt.dataset.address || '') : '';
  const wrap = select.closest('.modal-body,.card-body');
  if (wrap) {
    const f = wrap.querySelector('.org-address-field');
    if (f) f.value = address;
  }
}

function fetchSuggestions(q) {
  fetch('/letters/api/tags?q=' + encodeURIComponent(q))
    .then(r => r.json())
    .then(items => {
      const box = document.getElementById('tagSuggestions');
      box.innerHTML = '';
      if (!items.length) { hideSuggestions(); return; }
      items.forEach(item => {
        const a = document.createElement('a');
        a.href = '#';
        a.className = 'list-group-item list-group-item-action py-1 px-2';
        a.textContent = item.name;
        a.addEventListener('click', function (e) {
          e.preventDefault();
          addTag(item.name);
          document.getElementById('tagInput').value = '';
          hideSuggestions();
        });
        box.appendChild(a);
      });
      box.style.display = 'block';
    });
}

function hideSuggestions() {
  const box = document.getElementById('tagSuggestions');
  if (box) { box.style.display = 'none'; box.innerHTML = ''; }
}

// ─── Шаблоны писем ───

let _tplLoaded = false;

function toggleTplDropdown() {
  const dd = document.getElementById('tplDropdown');
  const visible = dd.style.display !== 'none';
  if (visible) { hideTplDropdown(); return; }
  dd.style.display = 'block';
  if (!_tplLoaded) { loadTemplates(''); }
}

function hideTplDropdown() {
  const dd = document.getElementById('tplDropdown');
  if (dd) dd.style.display = 'none';
}

function loadTemplates(q) {
  const dd = document.getElementById('tplDropdown');

  fetch('/letters/api/templates?q=' + encodeURIComponent(q))
    .then(r => r.json())
    .then(items => {
      dd.innerHTML = '';

      if (!items.length) {
        const empty = document.createElement('div');
        empty.className = 'list-group-item list-group-item-light py-1 px-2 small text-muted';
        empty.textContent = 'Шаблонов нет';
        dd.appendChild(empty);
        _tplLoaded = true;
        return;
      }

      const searchRow = document.createElement('div');
      searchRow.className = 'list-group-item py-1 px-2';
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'form-control form-control-sm';
      inp.id = 'tplSearch';
      inp.placeholder = 'Поиск шаблона...';
      searchRow.appendChild(inp);
      dd.appendChild(searchRow);

      const listWrap = document.createElement('div');
      dd.appendChild(listWrap);

      function renderItems(list) {
        listWrap.innerHTML = '';
        list.forEach(item => {
          const a = document.createElement('a');
          a.href = '#';
          a.className = 'list-group-item list-group-item-action py-1 px-2';
          a.innerHTML = `<div class="fw-semibold small">${item.name}</div>`
                      + (item.subject ? `<div class="text-muted" style="font-size:.75rem">${item.subject}</div>` : '');
          a.addEventListener('click', function (e) {
            e.preventDefault();
            applyTemplate(item);
            hideTplDropdown();
          });
          listWrap.appendChild(a);
        });
      }

      renderItems(items);
      _tplLoaded = true;

      let _tplTimer = null;
      inp.addEventListener('input', function () {
        clearTimeout(_tplTimer);
        const sq = this.value.trim();
        _tplTimer = setTimeout(() => {
          fetch('/letters/api/templates?q=' + encodeURIComponent(sq))
            .then(r => r.json())
            .then(renderItems);
        }, 250);
      });
    });
}

function applyTemplate(tpl) {
  if (tpl.subject) document.getElementById('fSubject').value = tpl.subject;
  if (tpl.body)    document.getElementById('fNote').value    = tpl.body;
}
</script>
